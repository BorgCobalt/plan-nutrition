<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plan Nutrition</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a6b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:          #faf7f0;
  --surface:     #ffffff;
  --surface-2:   #f2ede1;
  --border:      #e6ddc9;
  --ink:         #2c2a24;
  --ink-dim:     #726c5c;
  --ink-faint:   #a49c88;
  --green:       #4a6b4f;
  --green-light: #6f8f70;
  --green-bg:    #e8f0e6;
  --terracotta:  #c96f4a;
  --terracotta-bg:#fbeae1;
  --gold:        #e0a458;
  --today-bg:    #fff3e0;
  --shadow:      0 2px 10px rgba(60,50,20,0.08);
  --radius:      14px;
  --radius-sm:   9px;
}
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
#app {
  display: flex; flex-direction: column;
  height: 100dvh; width: 100%;
  max-width: 520px; margin: 0 auto;
  background: var(--bg);
  position: relative; overflow: hidden;
}
h1, h2, .display {
  font-family: 'Fraunces', Georgia, serif;
}

/* ── HEADER ── */
.header {
  flex-shrink: 0;
  padding: env(safe-area-inset-top, 0) 18px 14px;
  padding-top: calc(env(safe-area-inset-top, 0) + 16px);
  display: flex; align-items: flex-start; justify-content: space-between;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-title { font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.15; }
.header-week { font-size: 13px; color: var(--ink-dim); margin-top: 3px; }
.header-sync { font-size: 11px; color: var(--ink-faint); margin-top: 6px; display: flex; align-items: center; gap: 5px; }
.header-sync.syncing { color: var(--green); }
.header-sync.error { color: var(--terracotta); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--ink-dim); font-size: 17px; width: 38px; height: 38px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.icon-btn:active { background: var(--border); }
.icon-btn.spinning svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TABS ── */
.tabs { flex-shrink: 0; display: flex; gap: 6px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab {
  flex: 1; text-align: center; padding: 9px 0; border-radius: 10px;
  font-size: 14px; font-weight: 600; color: var(--ink-dim);
  background: transparent; border: none; cursor: pointer;
}
.tab.active { background: var(--green); color: #fff; }

/* ── SCROLL AREA ── */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 28px; }
.scroll::-webkit-scrollbar { display: none; }

/* ── DAY CARD ── */
.day-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.day-card.today { background: var(--today-bg); border-color: var(--gold); }
.day-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
.day-label { font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600; color: var(--ink); }
.day-date { font-size: 11px; color: var(--ink-faint); }
.today-badge {
  margin-left: auto; font-size: 10px; font-weight: 700; color: #fff; background: var(--gold);
  padding: 2px 8px; border-radius: 20px; letter-spacing: 0.03em; text-transform: uppercase;
}
.meal-row { padding: 7px 0; }
.meal-row + .meal-row { border-top: 1px dashed var(--border); }
.meal-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.meal-tag {
  font-size: 11.5px; font-weight: 600; color: var(--green);
  text-transform: uppercase; letter-spacing: 0.03em;
}
.meal-time { font-size: 11px; color: var(--ink-faint); }
.meal-badge {
  margin-left: auto; font-size: 10px; font-weight: 700; color: var(--terracotta);
  background: var(--terracotta-bg); padding: 2px 7px; border-radius: 20px;
}
.meal-text { font-size: 14px; color: var(--ink); line-height: 1.4; }

/* ── SHOPPING ── */
.shop-group { margin-bottom: 18px; }
.shop-group-title {
  font-size: 12px; font-weight: 700; color: var(--green); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 7px; padding-left: 2px;
}
.shop-item {
  display: flex; align-items: center; gap: 11px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 7px;
  cursor: pointer; box-shadow: var(--shadow);
}
.shop-item:active { background: var(--surface-2); }
.shop-check {
  flex-shrink: 0; width: 21px; height: 21px; border-radius: 6px; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff;
}
.shop-item.checked .shop-check { background: var(--green); border-color: var(--green); }
.shop-item.checked .shop-name { color: var(--ink-faint); text-decoration: line-through; }
.shop-name { font-size: 14.5px; color: var(--ink); flex: 1; }

/* ── EMPTY / ONBOARDING ── */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 12px; padding: 40px 24px; height: 100%;
}
.empty .emoji { font-size: 40px; }
.empty h2 { font-size: 18px; font-weight: 600; }
.empty p { font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

const state = {
  plan: null,
  tab: 'repas',
  loading: false,
  error: '',
  checked: {},
};

const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

const MEAL_SLOTS = [
  { key: 'avant',      label: 'Avant la séance',              time: '6h45' },
  { key: 'petitDej',   label: 'Petit-déjeuner après séance',  time: '8h15' },
  { key: 'collation1', label: 'Collation',                    time: '10h30' },
  { key: 'dejeuner',   label: 'Déjeuner',                      time: '12h30-13h' },
  { key: 'collation2', label: 'Collation',                    time: '16h' },
  { key: 'diner',      label: 'Dîner',                         time: '19h30-21h' },
];

function loadLocal() {
  try {
    state.plan = JSON.parse(localStorage.getItem('pn-plan') || 'null');
  } catch (e) {}
}
function savePlanCache() { if (state.plan) localStorage.setItem('pn-plan', JSON.stringify(state.plan)); }

function loadChecked() {
  if (!state.plan) return;
  try {
    const all = JSON.parse(localStorage.getItem('pn-checked') || '{}');
    state.checked = all[state.plan.weekOf] || {};
  } catch (e) { state.checked = {}; }
}
function saveChecked() {
  if (!state.plan) return;
  const all = JSON.parse(localStorage.getItem('pn-checked') || '{}');
  all[state.plan.weekOf] = state.checked;
  localStorage.setItem('pn-checked', JSON.stringify(all));
}

async function fetchPlan(showSpinner) {
  state.loading = !!showSpinner;
  state.error = '';
  render();
  try {
    const r = await fetch('./plan.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`Erreur ${r.status}`);
    const data = await r.json();
    state.plan = data;
    savePlanCache();
    loadChecked();
  } catch (e) {
    state.error = e.message || 'Échec de synchronisation';
  } finally {
    state.loading = false;
    render();
  }
}

function fmtDate(iso) {
  try {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
  } catch (e) { return iso; }
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function weekRange(days) {
  if (!days || !days.length) return '';
  return `${fmtDate(days[0].date)} → ${fmtDate(days[days.length-1].date)}`;
}
function timeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'à l’instant';
  if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `il y a ${Math.floor(diff/3600)} h`;
  return `il y a ${Math.floor(diff/86400)} j`;
}

function doubleQuantities(text) {
  if (!text) return text;
  return text.replace(/\d+(?:[.,]\d+)?/g, match => {
    const num = parseFloat(match.replace(',', '.'));
    if (isNaN(num)) return match;
    let doubled = Math.round(num * 2 * 100) / 100;
    let str = String(doubled);
    if (match.includes(',')) str = str.replace('.', ',');
    return str;
  });
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  app.appendChild(renderHeader());
  app.appendChild(renderTabs());

  const scroll = el(`<div class="scroll"></div>`);
  if (!state.plan) {
    scroll.appendChild(el(`<div class="empty"><div class="emoji">🍲</div><h2>En attente du plan</h2><p>${state.error || 'Récupération du plan de la semaine…'}</p></div>`));
  } else if (state.tab === 'repas') {
    scroll.appendChild(renderRepas());
  } else {
    scroll.appendChild(renderCourses());
  }
  app.appendChild(scroll);
}

function renderHeader() {
  const syncClass = state.loading ? 'syncing' : (state.error ? 'error' : '');
  const syncLabel = state.loading ? 'Synchronisation…' : (state.error ? state.error : (state.plan ? `Actualisé ${timeAgo(state.plan.updatedAt)}` : ''));
  const h = el(`
    <div class="header">
      <div>
        <div class="header-title">Plan Nutrition</div>
        <div class="header-week">${state.plan ? weekRange(state.plan.days) : 'Semaine à venir'}</div>
        <div class="header-sync ${syncClass}"><span class="dot"></span><span>${syncLabel}</span></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn ${state.loading ? 'spinning' : ''}" id="btn-refresh" aria-label="Actualiser">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v6h-6"/></svg>
        </button>
      </div>
    </div>
  `);
  h.querySelector('#btn-refresh').addEventListener('click', () => fetchPlan(true));
  return h;
}

function renderTabs() {
  const t = el(`
    <div class="tabs">
      <button class="tab ${state.tab==='repas'?'active':''}" data-tab="repas">Repas</button>
      <button class="tab ${state.tab==='courses'?'active':''}" data-tab="courses">Courses</button>
    </div>
  `);
  t.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); }));
  return t;
}

function renderRepas() {
  const wrap = el(`<div></div>`);
  const today = todayIso();
  (state.plan.days || []).forEach(day => {
    const isToday = day.date === today;
    const rows = MEAL_SLOTS.map(slot => {
      const isDiner = slot.key === 'diner';
      const raw = day[slot.key] || '—';
      const text = isDiner ? doubleQuantities(raw) : raw;
      return `
      <div class="meal-row">
        <div class="meal-head">
          <span class="meal-tag">${slot.label}</span>
          <span class="meal-time">${slot.time}</span>
          ${isDiner ? '<span class="meal-badge">×2 pers.</span>' : ''}
        </div>
        <div class="meal-text">${text}</div>
      </div>
    `;
    }).join('');
    const card = el(`
      <div class="day-card ${isToday?'today':''}">
        <div class="day-head">
          <span class="day-label">${day.label}</span>
          <span class="day-date">${fmtDate(day.date)}</span>
          ${isToday ? '<span class="today-badge">Aujourd’hui</span>' : ''}
        </div>
        ${rows}
      </div>
    `);
    wrap.appendChild(card);
  });
  if (state.plan.notes) {
    wrap.appendChild(el(`<div class="day-card"><div class="meal-text">${state.plan.notes}</div></div>`));
  }
  return wrap;
}

function renderCourses() {
  const wrap = el(`<div></div>`);
  const groups = state.plan.shopping || [];
  if (!groups.length) {
    wrap.appendChild(el(`<div class="empty"><div class="emoji">🛒</div><h2>Rien à acheter</h2><p>La liste de courses est vide cette semaine.</p></div>`));
    return wrap;
  }
  groups.forEach(group => {
    const g = el(`<div class="shop-group"><div class="shop-group-title">${group.category}</div></div>`);
    (group.items || []).forEach(item => {
      const key = `${group.category}::${item}`;
      const isChecked = !!state.checked[key];
      const row = el(`
        <div class="shop-item ${isChecked?'checked':''}">
          <span class="shop-check">${isChecked?'✓':''}</span>
          <span class="shop-name">${item}</span>
        </div>
      `);
      row.addEventListener('click', () => {
        state.checked[key] = !state.checked[key];
        saveChecked();
        render();
      });
      g.appendChild(row);
    });
    wrap.appendChild(g);
  });
  return wrap;
}

// ── Init ──
loadLocal();
loadChecked();
render();
fetchPlan(!state.plan);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchPlan(false);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
